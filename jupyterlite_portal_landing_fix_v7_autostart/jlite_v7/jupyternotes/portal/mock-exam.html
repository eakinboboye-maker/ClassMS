<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Portal Mock Exam</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <div class="header"><div class="header-inner">Portal Mock Exam</div></div>
  <div class="wrap">
    <div class="card">
      <h2>Mock Exam</h2>
      <div class="kv"><strong>Lesson slug:</strong> <span id="lessonSlugView"></span></div>
      <div class="row">
        <button id="startBtn" class="btn btn-primary">Start Mock Exam</button>
        <button id="autosaveBtn" class="btn btn-secondary" disabled>Save Progress</button>
        <button id="submitBtn" class="btn btn-success" disabled>Submit</button>
      </div>
      <div id="status" class="notice notice-info">Start the mock exam from here.</div>
      <div id="saveStatus" class="notice notice-info">Save status: not saved yet.</div>
    </div>
    <div id="paper"></div>
    <div id="results"></div>
  </div>
  <script src="./assets/portal.js"></script>
  <script>
    const lessonSlug = new URLSearchParams(location.search).get("lesson_slug") || "";
    document.getElementById("lessonSlugView").textContent = lessonSlug;
    const startBtn = document.getElementById("startBtn");
    const autosaveBtn = document.getElementById("autosaveBtn");
    const submitBtn = document.getElementById("submitBtn");
    const statusEl = document.getElementById("status");
    const saveStatusEl = document.getElementById("saveStatus");
    const paperEl = document.getElementById("paper");
    const resultsEl = document.getElementById("results");
    let attempt = null;
    let paper = null;
    let saveTimer = null;
    let isSaving = false;
    let submitted = false;
    let lastSavedPayload = "";


    function setSaveStatus(message, kind = "info") {
      saveStatusEl.className = `notice notice-${kind}`;
      saveStatusEl.textContent = `Save status: ${message}`;
    }

    function disableExamControls() {
      startBtn.disabled = true;
      autosaveBtn.disabled = true;
      submitBtn.disabled = true;
      Array.from(paperEl.querySelectorAll("input, textarea, select, button")).forEach((el) => {
        el.disabled = true;
      });
    }

    function attachAutosaveHandlers() {
      Array.from(paperEl.querySelectorAll("input, textarea, select")).forEach((el) => {
        el.addEventListener("input", scheduleAutoSave);
        el.addEventListener("change", scheduleAutoSave);
      });
    }

    function scheduleAutoSave() {
      if (!attempt || submitted) return;
      setSaveStatus("unsaved changes; saving automatically...", "info");
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(() => saveProgress(false), 1000);
    }

    async function saveProgress(manual = true) {
      if (!attempt || submitted) return;
      const responses = collectResponses();
      const payload = JSON.stringify(responses);
      if (!manual && payload === lastSavedPayload) return;
      if (isSaving) return;
      isSaving = true;
      autosaveBtn.disabled = true;
      setSaveStatus("saving...", "info");
      try {
        await autosavePortalMock(attempt.attempt_id, responses);
        lastSavedPayload = payload;
        const mode = manual ? "manual" : "automatic";
        setSaveStatus(`saved at ${new Date().toLocaleTimeString()} (${mode})`, "success");
      } catch (err) {
        setSaveStatus(`save failed: ${err.message || String(err)}`, "error");
      } finally {
        isSaving = false;
        if (!submitted) autosaveBtn.disabled = false;
      }
    }

    function renderQuestion(item) {
      const div = document.createElement("div");
      div.className = "question";
      let body = "";
      if (item.type === "mcq_single") {
        body = (item.options || []).map((opt) => `<label style="display:block; margin:8px 0;"><input type="radio" name="q_${item.question_id}" value="${opt.option_key}" /> ${opt.text}</label>`).join("");
      } else if (item.type === "mcq_multi") {
        body = (item.options || []).map((opt) => `<label style="display:block; margin:8px 0;"><input type="checkbox" name="q_${item.question_id}" value="${opt.option_key}" /> ${opt.text}</label>`).join("");
      } else if (item.type === "fill_gap") {
        body = (item.gaps || []).map((gap) => `<div style="margin:8px 0;"><label><strong>${gap.gap_key}</strong></label><input class="input" data-gap-key="${gap.gap_key}" data-question-id="${item.question_id}" /></div>`).join("");
      } else {
        body = `<textarea class="textarea" data-question-id="${item.question_id}" placeholder="Type your answer here..."></textarea>`;
      }
      div.innerHTML = `<div><strong>Question ${item.question_id}</strong></div><div class="kv" style="margin-top:8px;">${item.prompt_md}</div><div style="margin-top:12px;">${body}</div>`;
      return div;
    }

    function collectResponses() {
      const responses = [];
      (paper?.items || []).forEach((item) => {
        if (item.type === "mcq_single") {
          const selected = document.querySelector(`input[name="q_${item.question_id}"]:checked`);
          responses.push({ question_id: item.question_id, response: { selected_option: selected ? selected.value : null } });
        } else if (item.type === "mcq_multi") {
          const selected = Array.from(document.querySelectorAll(`input[name="q_${item.question_id}"]:checked`)).map((x) => x.value);
          responses.push({ question_id: item.question_id, response: { selected_options: selected } });
        } else if (item.type === "fill_gap") {
          const gaps = {};
          Array.from(document.querySelectorAll(`[data-question-id="${item.question_id}"][data-gap-key]`)).forEach((inp) => { gaps[inp.dataset.gapKey] = inp.value; });
          responses.push({ question_id: item.question_id, response: { gaps } });
        } else {
          const area = document.querySelector(`textarea[data-question-id="${item.question_id}"]`);
          responses.push({ question_id: item.question_id, response: { answer_text: area ? area.value : "" } });
        }
      });
      return responses;
    }

    function renderResults(result) {
      resultsEl.innerHTML = `<div class="card"><h2>Your Score</h2><div>${result.total_awarded} / ${result.total_max}</div></div>`;
      (result.items || []).forEach((item) => {
        const status = item.is_correct ? "Correct" : "Needs Review / Incorrect";
        const color = item.is_correct ? "#15803d" : "#b91c1c";
        const div = document.createElement("div");
        div.className = "question";
        div.innerHTML = `
          <div><strong>Question ${item.question_id}</strong></div>
          <div class="kv">${item.prompt_md}</div>
          <div style="color:${color}; font-weight:800; margin-top:6px;">${status}</div>
          <div class="kv"><strong>Score:</strong> ${item.awarded_marks} / ${item.max_marks}</div>
          ${item.show_explanation_after_submit && item.explanation_md ? `<div class="notice notice-info">${item.explanation_md}</div>` : ""}
        `;
        resultsEl.appendChild(div);
      });
    }

    startBtn.onclick = async () => {
      try {
        attempt = await startPortalMockExam(lessonSlug);
        paper = await fetchPortalMockPaper(attempt.attempt_id);
        paperEl.innerHTML = "";
        (paper.items || []).forEach((item) => paperEl.appendChild(renderQuestion(item)));
        startBtn.disabled = true;
        autosaveBtn.disabled = false;
        submitBtn.disabled = false;
        attachAutosaveHandlers();
        setSaveStatus("not saved yet; changes will save automatically", "info");
        statusEl.className = "notice notice-success";
        statusEl.textContent = "Mock exam loaded.";
      } catch (err) {
        statusEl.className = "notice notice-error";
        statusEl.textContent = err.message || String(err);
      }
    };

    autosaveBtn.onclick = async () => {
      if (saveTimer) clearTimeout(saveTimer);
      await saveProgress(true);
    };

    submitBtn.onclick = async () => {
      try {
        if (saveTimer) clearTimeout(saveTimer);
        startBtn.disabled = true;
        autosaveBtn.disabled = true;
        submitBtn.disabled = true;
        setSaveStatus("submitting final answers...", "info");
        await autosavePortalMock(attempt.attempt_id, collectResponses());
        lastSavedPayload = JSON.stringify(collectResponses());
        await submitPortalMock(attempt.attempt_id, { lesson: lessonSlug, submitted_from: "portal", submitted_at: new Date().toISOString(), done: true });
        submitted = true;
        disableExamControls();
        setSaveStatus(`submitted at ${new Date().toLocaleTimeString()}; final answers are locked`, "success");
        const result = await resultsPortalMock(attempt.attempt_id);
        renderResults(result);
        statusEl.className = "notice notice-success";
        statusEl.textContent = "Submitted. All controls are now disabled.";
      } catch (err) {
        if (!submitted) {
          autosaveBtn.disabled = false;
          submitBtn.disabled = false;
        }
        statusEl.className = "notice notice-error";
        statusEl.textContent = err.message || String(err);
        setSaveStatus(`submit failed: ${err.message || String(err)}`, "error");
      }
    };
  </script>
</body>
</html>
